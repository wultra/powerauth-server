name: Build and deploy docker image

on:
  workflow_dispatch:
    inputs:
      push_to_registry:
        type: boolean
        default: false
        description: Publish to registry?
      environment:
        type: environment
        default: docker-internal
        description: Select the environment
  pull_request:
    branches:
      - 'develop'
      - 'master'
      - 'releases/*'
    paths:
      - '**'
      - '!docs/**'
      - 'docs/db/**'

jobs:
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      should_push: ${{ steps.set-cond.outputs.should_push }}
    steps:
      - name: Set environment output
        id: set-env
        run: |
          if [ -z "${{ inputs.environment }}" ]; then
            echo "environment=docker-internal" >> $GITHUB_OUTPUT
          else
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          fi
      - name: Set condition
        id: set-cond
        run: |
          if [[ "${{ inputs.push_to_registry }}" == "true" || 
                ("${{ github.ref }}" == "refs/heads/develop" && 
                 "${{ github.actor }}" != "dependabot[bot]" && 
                 "${{ github.event_name }}" == "push") ]]; then
            echo "should_push=true" >> $GITHUB_OUTPUT
          else
            echo "should_push=false" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: 'ubuntu-latest'
    needs: set-environment
    environment: ${{ needs.set-environment.outputs.environment }}
    env:
      # these are global secrets - for readonly access to artifactory
      INTERNAL_USERNAME: ${{ secrets.JFROG_USERNAME }}
      INTERNAL_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: jfrog-central
          server-username: INTERNAL_USERNAME
          server-password: INTERNAL_PASSWORD
      - name: Install Cosign
        if: ${{ needs.set-environment.outputs.should_push == 'true' }}
        uses: sigstore/cosign-installer@v4.0.0
        with:
          cosign-release: 'v3.0.2'
      - name: Check Cosign version
        if: ${{ needs.set-environment.outputs.should_push == 'true' }}
        run: cosign version
      - name: Set Timestamp for docker image for development branch
        if: github.ref == 'refs/heads/develop'
        run: echo "TIMESTAMP=-$(date +%Y.%m.%d)" >> $GITHUB_ENV
      - name: Get Powerauth Server version
        run: |
          cd powerauth-java-server
          REVISION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "----- Setting tags for nondistribution -----"
          echo "REVISION=$REVISION" >> $GITHUB_ENV
          IMAGE_VERSION=$REVISION${{ env.TIMESTAMP }}-${{ github.sha }}
          IMAGE_NAME=powerauth-server:${IMAGE_VERSION}
          INIT_IMAGE_NAME=powerauth-server-init:${IMAGE_VERSION}
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_ENV
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "INIT_IMAGE_NAME=$INIT_IMAGE_NAME" >> $GITHUB_ENV
          echo "----- Setting tags for distribution -----"
          DIST_IMAGE_VERSION=$REVISION${{ env.TIMESTAMP }}
          DIST_IMAGE_NAME=powerauth-server:${DIST_IMAGE_VERSION}
          DIST_INIT_IMAGE_NAME=powerauth-server-init:${DIST_IMAGE_VERSION}
          echo "DIST_IMAGE_VERSION=$DIST_IMAGE_VERSION" >> $GITHUB_ENV
          echo "DIST_IMAGE_NAME=$DIST_IMAGE_NAME" >> $GITHUB_ENV
          echo "DIST_INIT_IMAGE_NAME=$DIST_INIT_IMAGE_NAME" >> $GITHUB_ENV
      - name: Prepare wars and libs
        run: |
          mkdir -p ./powerauth-java-server/docker/images-and-libs
          mvn -B -U -pl powerauth-java-server -am -DuseInternalRepo=true -Dmaven.test.skip=true --no-transfer-progress package
          cp ./powerauth-java-server/target/powerauth-java-server-${{ env.REVISION }}.war ./powerauth-java-server/docker/images-and-libs/powerauth-java-server.war
      - name: Prepare SBOM files
        run: |
          mkdir -p ./powerauth-java-server/docker/sbom
          unzip -p ./powerauth-java-server/docker/images-and-libs/powerauth-java-server.war WEB-INF/classes/META-INF/sbom/application.cdx.json > ./powerauth-java-server/docker/sbom/powerauth-java-server.cdx.json
      - name: Copy liquibase files
        run: |
          mkdir -p ./powerauth-java-server/docker-init/liquibase/data/
          cp -r ./docs/db/changelog/changesets/powerauth-java-server ./powerauth-java-server/docker-init/liquibase/data
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ACR
        if: vars.ACR_REGISTRY_URL != '' && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY_URL }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Log in to Distribution registry
        if: vars.DISTRIBUTION_REGISTRY_URL != '' && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DISTRIBUTION_REGISTRY_URL }}
          username: ${{ vars.DISTRIBUTION_USERNAME }}
          password: ${{ secrets.DISTRIBUTION_PASSWORD }}
      - name: Set dynamic tags for image
        run: |
          {
            echo "TAGS<<EOF" 
              echo "${{ vars.ACR_REGISTRY_URL != ''  && format('{0}/{1}', vars.ACR_REGISTRY_URL, env.IMAGE_NAME) || '' }}"
              echo "${{ vars.DISTRIBUTION_REGISTRY_URL != '' && format('{0}/{1}', vars.DISTRIBUTION_REGISTRY_URL, env.DIST_IMAGE_NAME) || '' }}"
            echo "EOF"
          } >> $GITHUB_ENV
          {
           echo "INIT_TAGS<<EOF" 
              echo "${{ vars.ACR_REGISTRY_URL != ''  && format('{0}/{1}', vars.ACR_REGISTRY_URL, env.INIT_IMAGE_NAME) || '' }}"
              echo "${{ vars.DISTRIBUTION_REGISTRY_URL != '' && format('{0}/{1}', vars.DISTRIBUTION_REGISTRY_URL, env.DIST_INIT_IMAGE_NAME) || '' }}"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          push: ${{ needs.set-environment.outputs.should_push == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.TAGS }}
          file: powerauth-java-server/docker/Dockerfile
          context: .
      - name: Build and push init container image to registry
        uses: docker/build-push-action@v6
        with:
          push: ${{ needs.set-environment.outputs.should_push == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.INIT_TAGS }}
          file: powerauth-java-server/docker-init/Dockerfile
          context: .
      - name: Resolve image digests
        if: ${{ needs.set-environment.outputs.should_push == 'true' }}
        id: digests
        uses: wultra/wultra-infrastructure/.github/actions/collect-digests@develop
        with:
          TAGS: ${{ env.TAGS }}
          INIT_TAGS: ${{ env.INIT_TAGS }}
      - name: Show results from outputs
        if: ${{ needs.set-environment.outputs.should_push == 'true' }}
        run: |
          echo "TAGS_DIGESTS from outputs: ${{ steps.digests.outputs.TAGS_DIGESTS }}"
          echo "INIT_TAGS_DIGESTS from outputs: ${{ steps.digests.outputs.INIT_TAGS_DIGESTS }}"
      - name: Sign images with a key
        if: ${{ needs.set-environment.outputs.should_push == 'true' }}
        uses: wultra/wultra-infrastructure/.github/actions/sign-images@develop
        with:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          IMAGES: ${{ steps.digests.outputs.INIT_TAGS_DIGESTS }}
      - name: Attest images and SBOMs with a key
        if: ${{ needs.set-environment.outputs.should_push == 'true' }}
        uses: wultra/wultra-infrastructure/.github/actions/attest-images@develop
        with:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          IMAGES: ${{ steps.digests.outputs.TAGS_DIGESTS }}
          INPUT_FILES: '/sbom/powerauth-java-server.cdx.json'
          INPUT_FILES_PATH: './powerauth-java-server/docker/sbom'
