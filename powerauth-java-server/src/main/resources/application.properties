# Allow externalization of properties using application-ext.properties
spring.profiles.active=ext

# Database Configuration - PostgreSQL
spring.datasource.url=${POWERAUTH_SERVER_DATASOURCE_URL:jdbc:postgresql://host.docker.internal:5432/powerauth}
spring.datasource.username=${POWERAUTH_SERVER_DATASOURCE_USERNAME:powerauth}
spring.datasource.password=${POWERAUTH_SERVER_DATASOURCE_PASSWORD:}
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.pool-name=HikariPool-PowerAuth-Server
spring.jpa.properties.hibernate.connection.characterEncoding=${POWERAUTH_SERVER_JPA_CHARACTER_ENCODING:utf8}
spring.jpa.properties.hibernate.connection.useUnicode=${POWERAUTH_SERVER_JPA_USE_UNICODE:true}

# Database Configuration - Oracle
#spring.datasource.url=jdbc:oracle:thin:@//127.0.0.1:1521/powerauth
#spring.datasource.username=powerauth
#spring.datasource.password=

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none

# PowerAuth Service Configuration
powerauth.service.applicationName=${POWERAUTH_SERVER_APPLICATION_NAME:powerauth-server}
powerauth.service.applicationDisplayName=${POWERAUTH_SERVER_APPLICATION_DISPLAY_NAME:PowerAuth Server}
powerauth.service.applicationEnvironment=${POWERAUTH_SERVER_APPLICATION_ENVIRONMENT:}
powerauth.service.restrictAccess=${POWERAUTH_SERVER_RESTRICT_ACCESS:false}

# PowerAuth Service Crypto Configuration
powerauth.service.crypto.generateActivationIdIterations=10
powerauth.service.crypto.generateTokenIdIterations=10
powerauth.service.crypto.generateActivationCodeIterations=10
powerauth.service.crypto.generateOperationIterations=10
powerauth.service.crypto.activationValidityInMilliseconds=${POWERAUTH_SERVER_ACTIVATION_VALIDITY_MILLIS:300000}
powerauth.service.crypto.authenticationCodeMaxFailedAttempts=${POWERAUTH_SERVER_AUTHENTICATION_CODE_MAX_FAILED_ATTEMPTS:5}
powerauth.service.crypto.authenticationCodeValidationLookahead=20
powerauth.service.crypto.offlineAuthenticationCodeComponentLength=8
powerauth.service.crypto.requestExpirationInMilliseconds=300000
powerauth.service.crypto.requestExpirationInMillisecondsExtended=7200000
powerauth.service.crypto.replayVerificationService=default
powerauth.service.crypto.minSupportedProtocolVersion=3

# HTTP Proxy Settings
powerauth.service.http.proxy.enabled=${POWERAUTH_SERVER_HTTP_PROXY_ENABLED:false}
powerauth.service.http.proxy.host=${POWERAUTH_SERVER_HTTP_PROXY_HOST:127.0.0.1}
powerauth.service.http.proxy.port=${POWERAUTH_SERVER_HTTP_PROXY_PORT:8080}
powerauth.service.http.proxy.username=${POWERAUTH_SERVER_HTTP_PROXY_USERNAME:}
powerauth.service.http.proxy.password=${POWERAUTH_SERVER_HTTP_PROXY_PASSWORD:}

# HTTP Connection Configuration
# Without unit bind to milliseconds
powerauth.service.http.connection.timeout=${POWERAUTH_SERVER_HTTP_CONNECTION_TIMEOUT:5000}
powerauth.service.http.response.timeout=60s
powerauth.service.http.connection.max-idle-time=200s

# Vault Unlock behavior
powerauth.service.secureVault.enableBiometricAuthentication=${POWERAUTH_SERVER_SECURE_VAULT_ENABLE_BIOMETRY:false}

# Temporary Key Expiration in Milliseconds (default: 5 minutes)
powerauth.service.temporaryKey.validity=300000

# PowerAuth Service Scheduled Jobs
powerauth.service.scheduled.job.operationCleanup=5000
powerauth.service.scheduled.job.activationsCleanup=5000
powerauth.service.scheduled.job.activationsCleanup.lookBackInMilliseconds=3600000
powerauth.service.scheduled.job.uniqueValueCleanup=60000
powerauth.service.scheduled.job.fido2AuthenticatorCacheEviction=3600000
powerauth.service.scheduled.job.temporaryKeyCleanup=5000

# Database Lock Timeout Configuration
spring.jpa.properties.jakarta.persistence.lock.timeout=${POWERAUTH_SERVER_JPA_LOCK_TIMEOUT:10000}

# Set JMX default domain in case JMX is enabled, otherwise the application startup fails due to clash in JMX bean names
spring.jmx.default-domain=${POWERAUTH_SERVER_SPRING_JMX_DEFAULT_DOMAIN:powerauth-server}

# Master DB encryption key for decryption of server private key in database
powerauth.server.db.master.encryption.key=${POWERAUTH_SERVER_DB_MASTER_ENCRYPTION_KEY:}
powerauth.server.db.master.encryption.aead-kmac.key=${POWERAUTH_SERVER_DB_MASTER_ENCRYPTION_KEY_AEAD_KMAC:}
powerauth.server.db.master.encryption.algorithm=AEAD_KMAC

# Disable open session in view to avoid startup warning of Spring boot
spring.jpa.open-in-view=false

# Disable swagger-ui default petstore url
springdoc.swagger-ui.disable-swagger-default-url=true

# Set the Spring Boot application name
spring.application.name=powerauth-java-server

banner.application.name=${spring.application.name}
banner.application.version=@project.version@

# Configure Spring Cloud Vault Properties
spring.cloud.vault.enabled=false
spring.cloud.vault.kv.enabled=true

# Configure Spring Pageable properties
powerauth.service.pagination.default-page-size=500
powerauth.service.pagination.default-page-number=0

# Configure Spring JDBC batch size
spring.jpa.properties.hibernate.jdbc.batch_size=100

# Configure Correlation HTTP Header
powerauth.service.correlation-header.enabled=false
powerauth.service.correlation-header.name=X-Correlation-ID
powerauth.service.correlation-header.value.validation-regexp=[a-zA-Z0-9\\-]{8,1024}
# For logging correlation HTTP headers enable the pattern and update correlation header name in the pattern
#logging.pattern.console=%clr(%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) [%X{X-Correlation-ID}] %clr(%5p) %clr(${PID: }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}

powerauth.service.proximity-check.otp.length=${POWERAUTH_SERVER_PROXIMITY_CHECK_OTP_LENGTH:8}

# Monitoring
management.tracing.sampling.probability=1.0
#management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=health,info
management.info.git.mode=simple
#management.endpoint.prometheus.enabled=true
#management.prometheus.metrics.export.enabled=true

spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.metrics.jersey.JerseyServerMetricsAutoConfiguration


# --- Properties added from XML Context Parameters ---
# Database Charset configuration (complements existing characterEncoding/useUnicode)
spring.jpa.properties.hibernate.connection.CharSet=${POWERAUTH_SERVER_JPA_CHARSET:utf8}

# Database JNDI
spring.datasource.jndi-name=${POWERAUTH_SERVER_DATASOURCE_JNDI_NAME:false}

# JMX Configuration
spring.jmx.enabled=${POWERAUTH_SERVER_SPRING_JMX_ENABLED:false}
# Note: spring.jmx.default-domain already defined above, keeping existing value

# Custom Logging Configuration
logging.config=${POWERAUTH_SERVER_LOGGING:}

# Database Configuration - Connection pool
spring.datasource.hikari.maximumPoolSize=${POWERAUTH_SERVER_DATASOURCE_HIKARI_MAX_CONNECTIONS:10}
spring.datasource.hikari.minimumIdle=${POWERAUTH_SERVER_DATASOURCE_HIKARI_MIN_IDLE:10}

# Proximity Check Configuration
powerauth.service.proximity-check.otp.step-duration=${POWERAUTH_SERVER_PROXIMITY_CHECK_OTP_STEP_DURATION:30s}
powerauth.service.proximity-check.otp.step-count=${POWERAUTH_SERVER_PROXIMITY_CHECK_OTP_STEP_COUNT:1}

# Callbacks Processing Configuration
powerauth.service.callbacks.defaultMaxAttempts=${POWERAUTH_SERVER_CALLBACKS_DEFAULT_MAX_ATTEMPTS:1}
powerauth.service.callbacks.defaultRetentionPeriod=${POWERAUTH_SERVER_CALLBACKS_DEFAULT_RETENTION_PERIOD:30d}
powerauth.service.callbacks.defaultInitialBackoff=${POWERAUTH_SERVER_CALLBACKS_DEFAULT_INITIAL_BACKOFF:2s}
powerauth.service.callbacks.maxBackoff=${POWERAUTH_SERVER_CALLBACKS_MAX_BACKOFF:32s}
powerauth.service.callbacks.backoffMultiplier=${POWERAUTH_SERVER_CALLBACKS_BACKOFF_MULTIPLIER:1.5}
powerauth.service.callbacks.pendingCallbackUrlEventsDispatchLimit=${POWERAUTH_SERVER_CALLBACKS_PENDING_CALLBACK_URL_EVENTS_DISPATCH_LIMIT:100}
powerauth.service.callbacks.threadPoolCoreSize=${POWERAUTH_SERVER_CALLBACKS_THREAD_POOL_CORE_SIZE:1}
powerauth.service.callbacks.threadPoolMaxSize=${POWERAUTH_SERVER_CALLBACKS_THREAD_POOL_MAX_SIZE:2}
powerauth.service.callbacks.threadPoolQueueCapacity=${POWERAUTH_SERVER_CALLBACKS_THREAD_POOL_QUEUE_CAPACITY:1000}
powerauth.service.callbacks.forceRerunPeriod=${POWERAUTH_SERVER_CALLBACKS_FORCE_RERUN_PERIOD:}
powerauth.service.callbacks.failureThreshold=${POWERAUTH_SERVER_CALLBACKS_FAILURE_THRESHOLD:200}
powerauth.service.callbacks.failureResetTimeout=${POWERAUTH_SERVER_CALLBACKS_FAILURE_RESET_TIMEOUT:60s}
powerauth.service.callbacks.clients.cache.refreshAfterWrite=${POWERAUTH_SERVER_CALLBACKS_CLIENTS_CACHE_REFRESH_AFTER_WRITE:5m}
